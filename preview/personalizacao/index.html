<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Prévia — Personalização</title><style>body{font:16px system-ui;background:var(--fundo,#101710);color:#f3eee0;margin:0}main{max-width:720px;margin:5vh auto;padding:24px}section{background:var(--painel,#1b251b);border:1px solid #ffffff30;border-radius:12px;padding:24px}h1,h2{font-family:Georgia,serif}label{display:flex;justify-content:space-between;align-items:center;padding:12px 0}button{background:var(--destaque,#d4b778);color:#111;border:0;border-radius:6px;padding:12px 18px;cursor:pointer}.exemplo{border-left:4px solid var(--destaque,#d4b778);padding-left:15px}.aviso{color:#c5c6b5}</style><main><p>GRIMÓRIO · PRÉVIA LOCAL</p><h1>Suas cores, sua aventura.</h1><p class="aviso">Experimente uma combinação. Esta prévia não salva alterações na sua conta.</p><section><h2>Personalizar aparência</h2><label>Cor de fundo <input type="color" data-cor="fundo" value="#101710"></label><label>Cor dos painéis <input type="color" data-cor="painel" value="#1b251b"></label><label>Cor de destaque <input type="color" data-cor="destaque" value="#d4b778"></label><div class="exemplo"><h2>Ficha de personagem</h2><p>Veja suas cores aplicadas enquanto escolhe.</p><button type="button">Exemplo de botão</button></div><p><button id="restaurar" type="button">Restaurar cores originais</button></p></section></main><script>document.querySelectorAll('[data-cor]').forEach(i=>i.addEventListener('input',()=>document.documentElement.style.setProperty('--'+i.dataset.cor,i.value)));document.querySelector('#restaurar').onclick=()=>document.querySelectorAll('[data-cor]').forEach(i=>{i.value=i.defaultValue;document.documentElement.style.removeProperty('--'+i.dataset.cor)});</script></html>
